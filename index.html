.prompt { white-space: nowrap; }

.userhost {

}

.path {

}

.list-heading {

.assignment-card {

}

.assignment-name {
  color: #19b36b;
  font-weight: 700;
  margin-bottom: 8px;
}

.statement {
  color: #f2f2f2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: inherit;
  margin: 0 0 12px;

.program-actions {

  gap: 12px;

.copy-btn, .back-btn {

  color: white;
  background: #222;

  padding: 7px 13px;

.copy-btn:hover, .back-btn:hover {

.status {

  font-size: 13px;

.toolbar {

  align-items: center;

  margin: 12px 0;

@media(max-width:600px) {

`#include <stdio.h>
#include <stdlib.h>
#include <unistd.h>
#include <sys/wait.h>
#include <sys/types.h>

void bubbleSort(int arr[], int n)
{
    int i, j, temp;
    for (i = 0; i < n - 1; i++)
    {
        for (j = 0; j < n - i - 1; j++)
        {
            if (arr[j] > arr[j + 1])
            {
                temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
            }
        }
    }
}

void display(int arr[], int n)
{
    int i;
    for (i = 0; i < n; i++)
        printf("%d ", arr[i]);
    printf("\\n");
}

int main()
{
    int n, i;
    int arr[100];

    printf("Enter number of integers: ");
    scanf("%d", &n);
    printf("Enter %d integers:\\n", n);

    for (i = 0; i < n; i++)
        scanf("%d", &arr[i]);

    pid_t pid = fork();

    if (pid < 0)
    {
        perror("fork failed");
        exit(1);
    }

    if (pid == 0)
    {
        printf("\\n--- Child Process (Zombie Demo) ---\\n");
        printf("Child PID  : %d\\n", getpid());
        printf("Parent PID : %d\\n", getppid());

        bubbleSort(arr, n);

        printf("Child sorted array: ");
        display(arr, n);

        printf("Child is terminating...\\n");
        exit(0);
    }
    else
    {
        printf("\\n--- Parent Process (Zombie Demo) ---\\n");
        printf("Parent PID : %d\\n", getpid());
        printf("Child PID  : %d\\n", pid);

        bubbleSort(arr, n);

        printf("Parent sorted array: ");
        display(arr, n);

        printf("\\nParent sleeping for 10 seconds without wait()...\\n");
        printf("Child may become a ZOMBIE during this time.\\n");

        sleep(10);
        wait(NULL);

        printf("Zombie process cleared using wait().\\n");
    }

    pid_t pid2 = fork();

    if (pid2 < 0)
    {
        perror("fork failed");
        exit(1);
    }

    if (pid2 == 0)
    {
        printf("\\n--- Child Process (Orphan Demo) ---\\n");
        printf("Child PID        : %d\\n", getpid());
        printf("Original Parent  : %d\\n", getppid());

        printf("Child sleeping for 10 seconds...\\n");
        sleep(10);

        printf("New Parent PID   : %d\\n", getppid());
        printf("Child is still running as an ORPHAN.\\n");
        exit(0);
    }
    else
    {
        printf("\\n--- Parent Process (Orphan Demo) ---\\n");
        printf("Parent PID : %d\\n", getpid());
        printf("Child PID  : %d\\n", pid2);
        printf("Parent is exiting before the child...\\n");
        exit(0);
    }

    return 0;
}`,

`#include <stdio.h>
#include <pthread.h>
#include <semaphore.h>
#include <stdlib.h>
#include <time.h>

#define SIZE 5

int buffer[SIZE];
int in = 0, out = 0;

sem_t empty, full;
pthread_mutex_t mutex;

void *producer(void *arg)
{
    int item;
    int count = 0;

    while (count < 25)
    {
        item = rand() % 50 + 1;
        sem_wait(&empty);
        pthread_mutex_lock(&mutex);

        buffer[in] = item;
        printf("Produced: %d\\n", item);
        in = (in + 1) % SIZE;

        pthread_mutex_unlock(&mutex);
        sem_post(&full);
        count++;
    }

    return NULL;
}

void *consumer(void *arg)
{
    int item;
    int count = 0;

    while (count < 25)
    {
        sem_wait(&full);
        pthread_mutex_lock(&mutex);

        item = buffer[out];
        printf("Consumed: %d\\n", item);
        out = (out + 1) % SIZE;

        pthread_mutex_unlock(&mutex);
        sem_post(&empty);
        count++;
    }

    return NULL;
}

int main()
{
    pthread_t p, c;
    srand(time(0));

    sem_init(&empty, 0, SIZE);
    sem_init(&full, 0, 0);
    pthread_mutex_init(&mutex, NULL);

    pthread_create(&p, NULL, producer, NULL);
    pthread_create(&c, NULL, consumer, NULL);

    pthread_join(p, NULL);
    pthread_join(c, NULL);

    sem_destroy(&empty);
    sem_destroy(&full);
    pthread_mutex_destroy(&mutex);

    return 0;
}`,

`#include <stdio.h>
#include <pthread.h>
#include <semaphore.h>
#include <unistd.h>

#define N 5

sem_t forks[N];
sem_t room;

void *philosopher(void *arg)
{
    int id = *(int *)arg;
    int left = id;
    int right = (id + 1) % N;

    printf("Philosopher %d is thinking\\n", id);
    sleep(1);

    sem_wait(&room);
    sem_wait(&forks[left]);
    sem_wait(&forks[right]);

    printf("Philosopher %d is eating\\n", id);
    sleep(1);

    sem_post(&forks[right]);
    sem_post(&forks[left]);
    sem_post(&room);

    printf("Philosopher %d finished eating\\n", id);
    return NULL;
}

int main()
{
    pthread_t threads[N];
    int id[N];

    sem_init(&room, 0, N - 1);

    for (int i = 0; i < N; i++)
        sem_init(&forks[i], 0, 1);

    for (int i = 0; i < N; i++)
    {
        id[i] = i;
        pthread_create(&threads[i], NULL, philosopher, &id[i]);
    }

    for (int i = 0; i < N; i++)
        pthread_join(threads[i], NULL);

    for (int i = 0; i < N; i++)
        sem_destroy(&forks[i]);

    sem_destroy(&room);
    return 0;
}`,

`#include <stdio.h>

int main()
{
    int n, m;
    int allocation[10][10], max[10][10], need[10][10];
    int available[10], work[10], finish[10];
    int safe[10], count = 0;

    printf("Enter number of processes: ");
    scanf("%d", &n);
    printf("Enter number of resources: ");
    scanf("%d", &m);

    printf("Enter Allocation Matrix:\\n");
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++)
            scanf("%d", &allocation[i][j]);

    printf("Enter Max Matrix:\\n");
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++)
            scanf("%d", &max[i][j]);

    printf("Enter Available Resources:\\n");
    for (int j = 0; j < m; j++)
        scanf("%d", &available[j]);

    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++)
            need[i][j] = max[i][j] - allocation[i][j];

    for (int j = 0; j < m; j++)
        work[j] = available[j];

    for (int i = 0; i < n; i++)
        finish[i] = 0;

    while (count < n)
    {
        int found = 0;

        for (int i = 0; i < n; i++)
        {
            if (finish[i] == 0)
            {
                int j;

                for (j = 0; j < m; j++)
                {
                    if (need[i][j] > work[j])
                        break;
                }

                if (j == m)
                {
                    for (j = 0; j < m; j++)
                        work[j] += allocation[i][j];

                    safe[count++] = i;
                    finish[i] = 1;
                    found = 1;
                }
            }
        }

        if (found == 0)
        {
            printf("System is not in a safe state.\\n");
            return 0;
        }
    }

    printf("System is in a safe state.\\n");
    printf("Safe Sequence: ");

    for (int i = 0; i < n; i++)
        printf("P%d ", safe[i]);

    printf("\\n");
    return 0;
}`,

`#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <fcntl.h>
#include <sys/wait.h>

int main()
{
    int pipe1[2], pipe2[2];
    pid_t pid;
    char filename[256];
    char buffer[1024];
    ssize_t n;

    if (pipe(pipe1) == -1 || pipe(pipe2) == -1)
    {
        perror("Pipe creation failed");
        return 1;
    }

    pid = fork();

    if (pid < 0)
    {
        perror("Fork failed");
        return 1;
    }

    if (pid > 0)
    {
        close(pipe1[0]);
        close(pipe2[1]);

        printf("Enter file pathname: ");
        fgets(filename, sizeof(filename), stdin);

        filename[strcspn(filename, "\\n")] = '\\0';

        write(pipe1[1], filename, strlen(filename) + 1);
        close(pipe1[1]);

        printf("\\nFile contents received from child:\\n\\n");

        while ((n = read(pipe2[0], buffer, sizeof(buffer))) > 0)
            write(STDOUT_FILENO, buffer, n);

        close(pipe2[0]);
        wait(NULL);
    }
    else
    {
        close(pipe1[1]);
        close(pipe2[0]);

        n = read(pipe1[0], filename, sizeof(filename));
        close(pipe1[0]);

        if (n <= 0)
        {
            perror("Failed to receive filename");
            close(pipe2[1]);
            exit(1);
        }

        int fd = open(filename, O_RDONLY);

        if (fd == -1)
        {
            perror("File opening failed");
            close(pipe2[1]);
            exit(1);
        }

        while ((n = read(fd, buffer, sizeof(buffer))) > 0)
        {
            if (write(pipe2[1], buffer, n) == -1)
            {
                perror("Pipe write failed");
                close(fd);
                close(pipe2[1]);
                exit(1);
            }
        }

        close(fd);
        close(pipe2[1]);
        exit(0);
    }

    return 0;
}`,

`#include <stdio.h>
#include <stdlib.h>

void sort(int a[], int n)
{
    int i, j, temp;

    for (i = 0; i < n - 1; i++)
    {
        for (j = 0; j < n - i - 1; j++)
        {
            if (a[j] > a[j + 1])
            {
                temp = a[j];
                a[j] = a[j + 1];
                a[j + 1] = temp;
            }
        }
    }
}

int main()
{
    int n, head, cylinders;
    int req[100], a[100];
    int i, j;
    int current, total;
    int left[100], right[100];
    int l = 0, r = 0;

    printf("Enter number of disk requests: ");
    scanf("%d", &n);

    if (n < 1 || n > 100)
    {
        printf("Invalid number of requests.\\n");
        return 1;
    }

    printf("Enter disk requests:\\n");

    for (i = 0; i < n; i++)
        scanf("%d", &req[i]);

    printf("Enter initial head position: ");
    scanf("%d", &head);

    printf("Enter total number of cylinders: ");
    scanf("%d", &cylinders);

    if (cylinders < 1 || head < 0 || head >= cylinders)
    {
        printf("Invalid disk size or head position.\\n");
        return 1;
    }

    for (i = 0; i < n; i++)
    {
        if (req[i] < 0 || req[i] >= cylinders)
        {
            printf("Invalid request: %d\\n", req[i]);
            return 1;
        }

        a[i] = req[i];
    }

    sort(a, n);

    for (i = 0; i < n; i++)
    {
        if (a[i] <= head)
            left[l++] = a[i];
        else
            right[r++] = a[i];
    }

    printf("\\nSSTF:\\n");

    int visited[100] = {0};
    current = head;
    total = 0;

    printf("Service order: ");

    for (i = 0; i < n; i++)
    {
        int best = -1;
        int distance = 1000000000;

        for (j = 0; j < n; j++)
        {
            if (!visited[j])
            {
                int d = abs(req[j] - current);

                if (d < distance)
                {
                    distance = d;
                    best = j;
                }
            }
        }

        visited[best] = 1;
        total += abs(req[best] - current);
        current = req[best];

        printf("%d ", current);
    }

    printf("\\nTotal head movement = %d\\n", total);

    printf("\\nSCAN (moving toward cylinder 0 first):\\n");

    current = head;
    total = 0;

    printf("Service order: ");

    for (i = l - 1; i >= 0; i--)
    {
        total += abs(current - left[i]);
        current = left[i];
        printf("%d ", current);
    }

    total += current;
    current = 0;

    for (i = 0; i < r; i++)
    {
        total += abs(right[i] - current);
        current = right[i];
        printf("%d ", current);
    }

    printf("\\nTotal head movement = %d\\n", total);

    printf("\\nC-LOOK (moving toward cylinder 0 first):\\n");

    current = head;
    total = 0;

    printf("Service order: ");

    for (i = l - 1; i >= 0; i--)
    {
        total += abs(current - left[i]);
        current = left[i];
        printf("%d ", current);
    }

    if (r > 0)
    {
        total += abs(current - right[r - 1]);
        current = right[r - 1];
        printf("%d ", current);

        for (i = r - 2; i >= 0; i--)
        {
            total += abs(current - right[i]);
            current = right[i];
            printf("%d ", current);
        }
    }

    printf("\\nTotal head movement = %d\\n", total);

    return 0;
}`

];

const screen = document.getElementById('screen');
const terminal = document.getElementById('terminal');

function makePrompt() {
  const line = document.createElement('div');
  line.className = 'prompt-line';

  const prompt = document.createElement('span');
  prompt.className = 'prompt';
  prompt.innerHTML =
    '<span class="userhost">student@student-HP-ProDesk-400-G4-SFF</span>:<span class="path">~</span><span class="dollar">$ </span>';

  const input = document.createElement('input');
  input.id = 'command';
  input.autocomplete = 'off';
  input.autocapitalize = 'off';
  input.spellcheck = false;

  input.addEventListener('keydown', handleCommand);
  line.append(prompt, input);
  screen.appendChild(line);
  input.focus();
  terminal.scrollTop = terminal.scrollHeight;
}

function printLine(text, className = 'output') {
  const line = document.createElement('div');
  line.className = className;
  line.textContent = text;
  screen.appendChild(line);
}

function handleCommand(event) {
  if (event.key !== 'Enter') return;

  const input = event.currentTarget;
  const command = input.value.trim().toLowerCase();

  input.disabled = true;
  input.removeAttribute('id');

  if (!command) {
    makePrompt();
    return;
  }

  if (command === 'clear') {
    screen.innerHTML = '';
    makePrompt();
    return;
  }

  // Only 96k opens the assignment list.
  if (command === '96k') {
    showAssignments();
    return;
  }

  if (command === 'exit') {
    printLine('exit');
    printLine('logout');
    printLine('The terminal session has ended.');

    window.close();

    setTimeout(() => {
      if (!window.closed) {
        printLine(
          'Browser blocked automatic closing. Please close this tab manually.',
          'muted'
        );
      }
    }, 150);

    return;
  }

  printLine(command + ': command not found');
  makePrompt();
}

function showAssignments() {
  screen.innerHTML = '';

  const heading = document.createElement('div');
  heading.className = 'list-heading';
  heading.textContent = 'LIST OF ASSIGNMENTS';
  screen.appendChild(heading);

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← Terminal';

  back.addEventListener('click', () => {
    screen.innerHTML = '';
    makePrompt();
  });

  toolbar.appendChild(back);
  screen.appendChild(toolbar);

  assignments.forEach(assignment => {
    const card = document.createElement('section');
    card.className = 'assignment-card';

    const title = document.createElement('div');
    title.className = 'assignment-name';
    title.textContent = assignment.title;

    const statement = document.createElement('pre');
    statement.className = 'statement';
    statement.textContent = assignment.statement;

    card.append(title, statement);

    assignment.programs.forEach(program => {
      const actions = document.createElement('div');
      actions.className = 'program-actions';

      const button = document.createElement('button');
      button.className = 'copy-btn';
      button.textContent = program.label;

      const status = document.createElement('span');
      status.className = 'status';
      status.setAttribute('aria-live', 'polite');

      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(program.code);
          status.textContent = 'Copied ✓';
        } catch (error) {
          const area = document.createElement('textarea');
          area.value = program.code;
          area.style.position = 'fixed';
          area.style.left = '-9999px';

          document.body.appendChild(area);
          area.select();

          const success = document.execCommand('copy');
          area.remove();

          status.textContent = success ? 'Copied ✓' : 'Copy failed';
        }

        setTimeout(() => status.textContent = '', 2200);
      });

      actions.append(button, status);
      card.appendChild(actions);
    });

    screen.appendChild(card);
  });

  terminal.scrollTop = 0;
}

document.getElementById('command')
  .addEventListener('keydown', handleCommand);

window.addEventListener('load', () => {
  document.getElementById('command')?.focus();
});
